<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #000;
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
  }

  body {
    display: flex;
    justify-content: center;
  }

  .invite-image {
    display: block;
    width: 100%;
    max-width: 700px;
    height: auto;
    opacity: 0;
    transition: opacity 1.6s ease;
  }

  .invite-image.show {
    opacity: 1;
  }
</style>
</head>
<body>

  <img
    src="file.png"
    alt="THE HACK : PRIVATE PARTY 초대장"
    class="invite-image"
    id="inviteImg"
  >

  <script>
    const img = document.getElementById('inviteImg');

    function fadeIn() {
      // 다음 프레임에 클래스를 추가해서 트랜지션이 확실히 걸리도록 함
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          img.classList.add('show');
        });
      });
    }

    if (img.complete) {
      fadeIn();
    } else {
      img.addEventListener('load', fadeIn);
    }
  </script>

</body>
